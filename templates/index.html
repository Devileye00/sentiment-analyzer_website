
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Sentiment Analyzer</title>

<style>
  :root {
    --bg: #eef2f3;
    --ink: #1c2b33;
    --muted: #5d6e77;
    --panel: #ffffff;
    --pos: #1f8a5b;
    --neg: #c0392b;
    --neu: #6b7b86;
    --line: #cfd8dc;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  h1 { font-size: 2rem; margin: 0 0 8px; }

  h2 { font-size: 1.35rem; }

  .lead { color: var(--muted); margin-bottom: 24px; }

  textarea {
    width: 100%;
    height: 150px;
    padding: 14px;
    font: 1rem/1.5 Georgia, serif;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    resize: vertical;
  }

  textarea:focus, button:focus-visible {
    outline: 3px solid #2a6f97;
    outline-offset: 2px;
  }

  button {
    margin: 8px 6px 8px 0;
    padding: 10px 16px;
    font: 600 1rem Georgia, serif;
    color: #fff;
    background: #1c2b33;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover { background: #2a6f97; }

  button:disabled { opacity: 0.6; cursor: wait; }

  #result, .history-item {
    margin-top: 20px;
    padding: 16px;
    background: var(--panel);
    border-left: 7px solid var(--neu);
    border-radius: 4px;
    overflow-wrap: anywhere;
  }

  #result { display: none; }
  #result.show { display: block; }

  #label { font-size: 1.6rem; font-weight: bold; margin: 0; }
  #score { color: var(--muted); margin: 4px 0 0; }

  .Positive { border-color: var(--pos) !important; }
  .Negative { border-color: var(--neg) !important; }
  .Neutral { border-color: var(--neu) !important; }
  .Mixed { border-color: #8e44ad !important; }

  .Positive #label, .Positive .history-label { color: var(--pos); }
  .Negative #label, .Negative .history-label { color: var(--neg); }
  .Neutral #label, .Neutral .history-label { color: var(--neu); }
  .Mixed #label, .Mixed .history-label { color: #8e44ad; }

  .error { color: var(--neg); }
  .history-item p { margin: 5px 0; }
  .muted { color: var(--muted); }
  #history-list { margin-top: 12px; }
  #empty-history { color: var(--muted); }

  .section-heading {
    margin-top: 36px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
</style>
</head>

<body>
<main>
  <h1>Review Sentiment Analyzer</h1>
  <p class="lead">
    Enter a product or movie review to classify it as Positive,
    Negative, Neutral, or Mixed.
  </p>

  <label for="review"><strong>Your review</strong></label>
  <textarea id="review" placeholder="Type your review here..."></textarea>
  <br>
  <button id="go" type="button">Analyze review</button>

  <div id="result" aria-live="polite">
    <p id="label"></p>
    <p id="score"></p>
  </div>

  <h2 class="section-heading">Sentiment Analysis History</h2>
  <p class="muted">
    Your recent analyses are saved in this browser.
  </p>

  <button id="clear-history" type="button">Clear History</button>
  <div id="history-list">
    <p id="empty-history">No reviews analyzed yet.</p>
  </div>
</main>

<script>
  const btn = document.getElementById("go");
  const reviewInput = document.getElementById("review");
  const box = document.getElementById("result");
  const historyList = document.getElementById("history-list");
  const HISTORY_KEY = "sentimentAnalyzerHistory";
  const MAX_HISTORY = 20;

  function getHistory() {
    try {
      const stored = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      return Array.isArray(stored) ? stored : [];
    } catch {
      return [];
    }
  }

  function renderHistory() {
    const history = getHistory();
    historyList.replaceChildren();

    if (history.length === 0) {
      const empty = document.createElement("p");
      empty.id = "empty-history";
      empty.className = "muted";
      empty.textContent = "No reviews analyzed yet.";
      historyList.appendChild(empty);
      return;
    }

    history.forEach(item => {
      const card = document.createElement("div");
      card.className = "history-item " + item.sentiment;

      const label = document.createElement("p");
      label.className = "history-label";
      label.textContent = item.sentiment;
      label.style.fontWeight = "bold";

      const review = document.createElement("p");
      review.textContent = item.review;

      const score = document.createElement("p");
      score.className = "muted";
      score.textContent = "Polarity score: " + item.polarity;

      const date = document.createElement("p");
      date.className = "muted";
      date.textContent = item.date;

      card.append(label, review, score, date);
      historyList.appendChild(card);
    });
  }

  function saveHistory(review, sentiment, polarity) {
    const history = getHistory();

    history.unshift({
      review,
      sentiment,
      polarity,
      date: new Date().toLocaleString()
    });

    try {
      localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history.slice(0, MAX_HISTORY))
      );
      renderHistory();
    } catch {
      // The analysis result remains available if browser storage fails.
    }
  }

  btn.addEventListener("click", async () => {
    const review = reviewInput.value.trim();

    if (!review) {
      box.className = "show";
      document.getElementById("label").textContent =
        "Please enter a review first.";
      document.getElementById("label").className = "error";
      document.getElementById("score").textContent = "";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Analyzing...";

    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ review })
      });

      const data = await res.json();
      box.className = "show";

      if (!res.ok) {
        document.getElementById("label").textContent =
          data.error || "Unable to analyze this review.";
        document.getElementById("label").className = "error";
        document.getElementById("score").textContent = "";
        return;
      }

      document.getElementById("label").className = "";
      box.className = "show " + data.sentiment;
      document.getElementById("label").textContent = data.sentiment;
      document.getElementById("score").textContent =
        "Polarity score: " + data.polarity + " (from -1 to +1)";

      saveHistory(review, data.sentiment, data.polarity);

    } catch {
      box.className = "show";
      document.getElementById("label").className = "error";
      document.getElementById("label").textContent =
        "Could not connect to the server. Make sure Flask is running.";
      document.getElementById("score").textContent = "";
    } finally {
      btn.disabled = false;
      btn.textContent = "Analyze review";
    }
  });

  document.getElementById("clear-history").addEventListener("click", () => {
    try {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    } catch {
      alert("Could not clear browser history.");
    }
  });

  renderHistory();
</script>
</body>
</html>
