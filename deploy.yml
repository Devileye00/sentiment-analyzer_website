---
- name: Deploy Sentiment Analyzer
  hosts: webservers
  become: yes
  vars:
    app_dir: /opt/sentiment-analyzer

  tasks:
    - name: Install Python and pip
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy application files
      synchronize:
        src: "{{ playbook_dir }}/"
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=venv"
          - "--exclude=__pycache__"

    - name: Install Python dependencies in a virtualenv
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Stop any running instance
      shell: pkill -f "gunicorn.*app:app" || true

    - name: Start the app with gunicorn
      shell: "{{ app_dir }}/venv/bin/gunicorn --daemon --bind 0.0.0.0:5000 --chdir {{ app_dir }} app:app"
